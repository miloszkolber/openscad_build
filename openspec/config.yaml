schema: spec-driven

context: |
  openscad_build publishes one OpenSCAD MCP server and browser image as
  ghcr.io/miloszkolber/openscad. The MCP runtime is in mcp/ and the browser in
  web/. See openspec/project.md for boundaries, openspec/specs/ for implemented
  contracts and compose/ for the deployment example. Host deployment and the
  weekly maintenance task are external owners. Publication is not deployment.
  Browser rendering is client-side WebAssembly; the MCP renderer is server-side
  WASM plus a short-lived image process.

rules:
  proposal:
    - Name affected capabilities, scope, status and required authorization.
    - Distinguish source-confirmed behavior from memory, proposals and live evidence.
  specs:
    - Use observable SHALL or MUST requirements with concrete boundary scenarios.
    - MODIFIED replaces a whole requirement. Preserve unaffected scenarios.
    - Add source and verification pointers without duplicating build runbooks.
    - Keep host configuration, historical incidents and unimplemented ideas out of main specs.
  design:
    - Record only consequential decisions, alternatives, risks and rollback.
    - Do not select speculative tooling or widen host authority without approval.
  tasks:
    - Number checkboxes and state how completion is verified in each task.
    - Keep tests and documentation with their implementation task group.
    - Separate executed checks from source review and pending operator acceptance.
