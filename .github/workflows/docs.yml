name: Documentation contracts

on:
  push:
    branches: [main]
    paths:
      - 'openspec/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'mcp/README.md'
      - 'web/README.md'
      - 'scripts/check-docs*'
      - 'docker/**'
      - 'compose/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'openspec/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'mcp/README.md'
      - 'web/README.md'
      - 'scripts/check-docs*'
      - 'docker/**'
      - 'compose/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: node scripts/check-docs.mjs
      - run: node --test scripts/check-docs.test.mjs
      - run: npx --yes @fission-ai/openspec@1.16.0 validate --all --strict
        env:
          OPENSPEC_TELEMETRY: '0'
