services:
  openscad:
    image: ${OPENSCAD_IMAGE:-ghcr.io/miloszkolber/openscad:latest}
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3333}
      HOST: ${HOST:-0.0.0.0}
      WORKSPACE_DIR: ${WORKSPACE_DIR:-/workspace}
      WEB_DIR: ${WEB_DIR:-/app/web/dist}
      MAX_RENDER_MS: ${MAX_RENDER_MS:-30000}
      MAX_OUTPUT_MB: ${MAX_OUTPUT_MB:-50}
      MAX_INPUT_MB: ${MAX_INPUT_MB:-50}
      MAX_PARALLEL_JOBS: ${MAX_PARALLEL_JOBS:-2}
      OPENSCAD_BACKEND: ${OPENSCAD_BACKEND:-wasm}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    ports:
      - '127.0.0.1:3333:3333'
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace:rw
    tmpfs:
      - /tmp:size=256m
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          '/usr/local/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3333/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
